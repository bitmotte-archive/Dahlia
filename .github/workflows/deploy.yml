name: Deploy

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: lower
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          target: prod
          push: true
          tags: ghcr.io/${{ steps.lower.outputs.owner }}/dahlia:${{ github.event.release.tag_name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/dahlia/
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o docker-compose.yaml \
              https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yaml
            echo ${{ github.event.release.tag_name }} > .current-deploy
            IMAGE_TAG=${{ github.event.release.tag_name }} docker compose pull
            IMAGE_TAG=${{ github.event.release.tag_name }} docker compose up -d
            docker image prune -af